[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-local"
version = "0.1.0"
description = "Privacy-first local agent that predicts network degradation minutes ahead and explains the failing layer in plain language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nakul Sinha" }]
keywords = ["networking", "anomaly-detection", "observability", "wifi", "dns", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "numpy>=1.24",
  "psutil>=5.9",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "build>=1.2",
]
package = ["pyinstaller>=6.6"]

[project.scripts]
netpulse = "netpulse.cli:main"

[project.urls]
Homepage = "https://github.com/Nakul-Sinha/Network-fault-detection"
Documentation = "https://github.com/Nakul-Sinha/Network-fault-detection/tree/main/docs"
Issues = "https://github.com/Nakul-Sinha/Network-fault-detection/issues"

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.setuptools.package-data]
netpulse = ["api/static/*", "ml/weights/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: tests that touch the real network or real OS tooling (deselect with -m 'not live')",
  "acceptance: PRD Appendix B acceptance checklist",
]

[tool.coverage.run]
source = ["netpulse"]
omit = ["netpulse/api/static/*"]
