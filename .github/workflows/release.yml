name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PYTHONUNBUFFERED: "1"

# Each job uploads its own assets straight to the release rather than handing
# them to a final job through the artifact store. The round trip was the only
# part of this pipeline that ever failed, twice, on "artifact download failed
# after 5 retries", with every build having succeeded. A job that has the file
# on disk should attach it there and then.
#
# The release is created as a draft first and published at the end, so nobody
# sees a half-populated release while the matrix is still running.

jobs:
  gate:
    name: Tests and PRD targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -m "not live"
      - name: PRD targets
        # A release that regressed lead time or started crying wolf does not
        # go out, whatever the version number says.
        run: python -m netpulse eval --gate

  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or reuse the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --title "NetPulse Local $TAG" \
            --generate-notes \
            --notes-file .github/release-notes.md

  distribution:
    name: sdist and wheel
    runs-on: ubuntu-latest
    needs: [draft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build cyclonedx-bom
          python -m build
      - name: Software bill of materials
        # PRD 14.3 packaging checklist.
        run: |
          python -m pip install .
          cyclonedx-py environment --output-format json --outfile dist/sbom.json \
            || echo "SBOM generation skipped"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

  binaries:
    name: Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: netpulse-linux-x86_64
          - os: windows-latest
            asset: netpulse-windows-x86_64.exe
          - os: macos-latest
            asset: netpulse-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[package]"
      - name: Build
        run: pyinstaller packaging/pyinstaller/netpulse.spec --clean --noconfirm
      - name: Smoke test the binary
        # The binary once built cleanly and died on first run, so running it
        # here is the point of this step, not a formality.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=dist/netpulse.exe; else BIN=dist/netpulse; fi
          "$BIN" version
          "$BIN" doctor
          "$BIN" demo --list
          "$BIN" check --json
      - name: Rename
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/netpulse.exe "dist/${{ matrix.asset }}"
          else
            mv dist/netpulse "dist/${{ matrix.asset }}"
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "dist/${{ matrix.asset }}" --clobber

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  publish:
    name: Checksums and publish
    runs-on: ubuntu-latest
    needs: [distribution, binaries, container]
    steps:
      - uses: actions/checkout@v4
      - name: Checksum every asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$TAG" --clobber
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
          echo "published $TAG"
