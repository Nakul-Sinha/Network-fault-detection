name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Pinned so the hash-seeded corners of the standard library behave the same
  # on every runner. The scenario corpus does not depend on it any more, but a
  # reproducible test run should not depend on that staying true.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # The linter version comes from the dev extra, so a rule that is
        # clean locally cannot fail here on a newer release.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check netpulse tests
      - name: ruff format
        run: ruff format --check netpulse tests
      - name: Workflow files parse
        run: python scripts/check_workflows.py

  test:
    name: Test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          # One Python per secondary platform keeps the matrix honest without
          # paying for six runners on every push.
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit and acceptance tests
        run: python -m pytest -m "not live" --cov=netpulse --cov-report=xml --cov-report=term
      - name: Installer smoke test
        # The same command a user runs after installing: one full collection
        # round through the real platform tooling on this runner.
        run: python -m netpulse check --json
      - name: Capability report
        run: python -m netpulse doctor
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  evaluate:
    name: Evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Replay the fault-injection corpus
        # Blocks the merge when a PRD 3.2 target regresses: lead time,
        # detection rate, layer attribution, alert precision or the false
        # alarm budget. A model change that quietly trades one of these for
        # another fails here rather than in someone's evening call.
        run: python -m netpulse eval --gate
      - name: The demo recordings match the current model
        # ADR 0003 makes the project site a replay of the real scorer rather
        # than a mock, which is only true while the recordings are current.
        # Regenerating and diffing is the cheapest way to keep that honest.
        run: |
          python scripts/build_demo_data.py
          if ! git diff --quiet -- web/public/data; then
            echo "::error::web/public/data is stale. Run scripts/build_demo_data.py and commit."
            git --no-pager diff --stat -- web/public/data
            exit 1
          fi
          echo "recordings are in step with the model"
      - name: Publish the report
        if: always()
        run: python -m netpulse --json eval > eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: eval-report.json
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit the declared runtime dependencies
        # PRD 12.2 asks for dependency scanning in CI. The audit reads the
        # dependency list from the project metadata rather than the installed
        # environment, which would include this project and has no PyPI entry
        # for pip-audit to resolve.
        run: |
          python scripts/runtime_requirements.py > requirements-runtime.txt
          cat requirements-runtime.txt
          pip-audit --strict --requirement requirements-runtime.txt --progress-spinner off

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel carries the trained model and the UI
        run: |
          python -m pip install --upgrade wheel
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "netpulse/ml/weights/l3_default.json",
              "netpulse/api/static/index.html",
              "netpulse/api/static/app.js",
              "netpulse/api/static/style.css",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing package data: {missing}")
          print(f"{wheel} contains every required data file")
          PY
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/netpulse version
          /tmp/fresh/bin/netpulse doctor
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t netpulse-local:ci -f packaging/docker/Dockerfile .
      - name: Run the smoke test inside the image
        # The image entrypoint is netpulse itself, so only the subcommand
        # goes here.
        run: |
          docker run --rm netpulse-local:ci version
          docker run --rm netpulse-local:ci doctor
