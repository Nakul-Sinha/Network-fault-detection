name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Pinned so the hash-seeded corners of the standard library behave the same
  # on every runner. The scenario corpus does not depend on it any more, but a
  # reproducible test run should not depend on that staying true.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # The linter version comes from the dev extra, so a rule that is
        # clean locally cannot fail here on a newer release.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check netpulse tests
      - name: ruff format
        run: ruff format --check netpulse tests

  test:
    name: Test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          # One Python per secondary platform keeps the matrix honest without
          # paying for six runners on every push.
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit and acceptance tests
        run: python -m pytest -m "not live" --cov=netpulse --cov-report=xml --cov-report=term
      - name: Installer smoke test
        # The same command a user runs after installing: one full collection
        # round through the real platform tooling on this runner.
        run: python -m netpulse check --json
      - name: Capability report
        run: python -m netpulse doctor
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  evaluate:
    name: Evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Replay the fault-injection corpus
        # Blocks the merge when a PRD 3.2 target regresses: lead time,
        # detection rate, layer attribution, alert precision or the false
        # alarm budget. A model change that quietly trades one of these for
        # another fails here rather than in someone's evening call.
        run: python -m netpulse eval --gate
      - name: Publish the report
        if: always()
        run: python -m netpulse --json eval > eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: eval-report.json
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Extract the declared runtime dependencies
        # Auditing the environment means auditing this project too, and it
        # has no PyPI entry to resolve, which --strict treats as an error.
        # What the job is actually for is the dependency tree that ships to
        # users, so it is audited directly from the project metadata.
        run: |
          python - <<'PY' > requirements-runtime.txt
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)
          print("
".join(data["project"]["dependencies"]))
          PY
          cat requirements-runtime.txt
      - name: Audit
        # PRD 12.2 asks for dependency scanning in CI.
        run: pip-audit --strict --requirement requirements-runtime.txt --progress-spinner off

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel carries the trained model and the UI
        run: |
          python -m pip install --upgrade wheel
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "netpulse/ml/weights/l3_default.json",
              "netpulse/api/static/index.html",
              "netpulse/api/static/app.js",
              "netpulse/api/static/style.css",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing package data: {missing}")
          print(f"{wheel} contains every required data file")
          PY
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/netpulse version
          /tmp/fresh/bin/netpulse doctor
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t netpulse-local:ci -f packaging/docker/Dockerfile .
      - name: Run the smoke test inside the image
        # The image entrypoint is netpulse itself, so only the subcommand
        # goes here.
        run: |
          docker run --rm netpulse-local:ci version
          docker run --rm netpulse-local:ci doctor
